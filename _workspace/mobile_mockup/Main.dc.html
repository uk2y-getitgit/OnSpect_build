<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#ffffff; --bg:#eceff5; --surface:#ffffff; --surface-2:#f5f7fa;
      --text:#1f2734; --text-muted:#666b73; --text-dim:#9aa4b0;
      --border:#d9dee8; --border-2:#eef1f6;
      --accent:#2d6cdf; --accent-weak:#e8f0fd; --accent-ink:#1b4ba8;
      --defect-current:#e5342a; --defect-prev:#7c4dff; --defect-repaired:#9aa4b0;
      --guide:#00b8d4; --ok:#2d8a66; --warn:#e3a535; --error:#d0342c;
      --radius:3px; --radius-lg:6px;
      --shadow:0 2px 8px rgba(31,39,52,.08);
      --shadow-float:0 6px 24px rgba(31,39,52,.16);
      --font-ui:'Noto Sans KR',Pretendard,-apple-system,"Segoe UI",sans-serif;
      --font-num:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font-ui);color:var(--text);}
    a{color:var(--accent);} a:hover{color:var(--accent-ink);}
    .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
      height:44px;padding:0 18px;border-radius:var(--radius);border:1px solid var(--border);
      background:var(--surface);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn-ghost{border-color:transparent;background:transparent;color:var(--text-muted);}
    .icon-btn{width:44px;height:44px;border-radius:var(--radius);border:1px solid var(--border);
      background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
    .pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;
      font-size:13px;font-weight:600;white-space:nowrap;}
  </style>
</helmet>

<div style="width:1180px;height:820px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <!-- Top bar -->
  <div style="height:72px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="font-size:22px;font-weight:700;">내 과업</span>
      <span style="font-size:14px;color:var(--text-dim);">OnSpect 현장</span>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="icon-btn" aria-label="검색">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="icon-btn" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </div>

  <!-- Task list -->
  <div style="flex:1 1 auto;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;">

    <!-- Card 1 : READY -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
        box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:19px;font-weight:700;">○○아파트 3차</span>
        </div>
        <span class="pill" style="background:#e3f3ea;color:var(--ok);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          준비완료 · 48MB
        </span>
      </div>
      <div style="font-size:14px;color:var(--text-muted);">2026 상반기 · 정기안전점검</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
        <span style="font-size:13px;color:var(--text-dim);" class="num">도면 13 · 전회차 27건</span>
        <div style="display:flex;gap:8px;">
          <div class="icon-btn" aria-label="더보기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </div>
          <button class="btn btn-primary" style="min-width:96px;">열기</button>
        </div>
      </div>
    </div>

    <!-- Card 2 : NONE -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
        box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:19px;font-weight:700;">△△병원 본관</span>
        <span class="pill" style="background:var(--surface-2);color:var(--text-dim);">미준비</span>
      </div>
      <div style="font-size:14px;color:var(--text-muted);">2026 상반기 · 정밀점검</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
        <span style="font-size:13px;color:var(--text-dim);" class="num">도면 8 · 전회차 0건</span>
        <button class="btn" style="border-color:var(--accent);color:var(--accent-ink);background:var(--accent-weak);gap:8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          오프라인 준비
        </button>
      </div>
    </div>

    <!-- Card 3 : DOWNLOADING -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
        box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:19px;font-weight:700;">▢▢상가</span>
        <span class="pill" style="background:var(--accent-weak);color:var(--accent-ink);">준비 중 62%</span>
      </div>
      <div style="font-size:14px;color:var(--text-muted);">2026 상반기 · 정밀점검</div>
      <div style="height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;">
        <div style="width:62%;height:100%;background:var(--accent);"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;color:var(--text-dim);" class="num">도면 8/13 · 30MB/48MB</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost">일시중지</button>
          <div class="icon-btn" aria-label="더보기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom status bar -->
  <div style="flex:0 0 auto;height:52px;background:var(--surface);border-top:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;color:var(--text-muted);">
    <span class="num">기기 여유 4.2GB</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <span>Wi-Fi 자동 준비</span>
      <div style="width:40px;height:24px;border-radius:12px;background:var(--ok);position:relative;">
        <div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;right:3px;box-shadow:0 1px 2px rgba(0,0,0,.3);"></div>
      </div>
      <span style="color:var(--ok);font-weight:600;">ON</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
