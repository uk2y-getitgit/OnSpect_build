<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#ffffff; --bg:#eceff5; --surface:#ffffff;
      --text:#1f2734; --text-muted:#666b73; --text-dim:#9aa4b0;
      --border:#d9dee8;
      --accent:#2d6cdf; --accent-weak:#e8f0fd; --accent-ink:#1b4ba8;
      --radius:3px; --radius-lg:6px;
      --shadow:0 2px 8px rgba(31,39,52,.08);
      --shadow-float:0 6px 24px rgba(31,39,52,.16);
      --font-ui:'Noto Sans KR',Pretendard,-apple-system,"Segoe UI",sans-serif;
      --font-num:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font-ui);color:var(--text);}
    a{color:var(--accent);} a:hover{color:var(--accent-ink);}
    .tool-btn{width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
    .tool-btn.active{background:var(--accent-weak);color:var(--accent-ink);}
  </style>
</helmet>

<div style="width:1180px;height:820px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="height:52px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 16px;gap:14px;">
    <span style="font-size:15px;font-weight:700;">○○아파트 3차</span>
    <span style="font-size:14px;color:var(--text-dim);">· 지상2층</span>
    <span style="margin-left:auto;font-size:12px;font-weight:700;color:#8a5a10;background:#fdf2df;
        border-radius:12px;padding:4px 12px;">비교안 B — 채택하지 않음</span>
  </div>

  <div style="flex:1 1 auto;position:relative;overflow:hidden;">

    <div style="position:absolute;left:96px;right:96px;top:24px;bottom:24px;background:var(--paper);
        border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <svg viewBox="0 0 900 640" width="94%" height="94%" preserveAspectRatio="xMidYMid meet" style="display:block;font-family:'Noto Sans KR',sans-serif;">
        <rect x="40" y="40" width="820" height="560" fill="none" stroke="#1f2734" stroke-width="4"/>
        <line x1="40" y1="260" x2="860" y2="260" stroke="#1f2734" stroke-width="3"/>
        <line x1="40" y1="380" x2="860" y2="380" stroke="#1f2734" stroke-width="3"/>
        <line x1="180" y1="40" x2="180" y2="260" stroke="#1f2734" stroke-width="2.5"/>
        <line x1="320" y1="40" x2="320" y2="260" stroke="#1f2734" stroke-width="2.5"/>
        <line x1="460" y1="40" x2="460" y2="260" stroke="#1f2734" stroke-width="2.5"/>
        <line x1="180" y1="380" x2="180" y2="600" stroke="#1f2734" stroke-width="2.5"/>
        <line x1="320" y1="380" x2="320" y2="600" stroke="#1f2734" stroke-width="2.5"/>
        <text x="248" y="150" font-size="14" fill="#9aa4b0">거실</text>
        <text x="386" y="150" font-size="14" fill="#9aa4b0">침실 1</text>
      </svg>
    </div>

    <!-- finger touch point + loupe stacked above it (iOS text-cursor style) -->
    <div style="position:absolute;left:52%;top:66%;">
      <!-- loupe -->
      <div style="position:absolute;left:0;top:-176px;width:150px;height:150px;transform:translateX(-50%);
          border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow-float);overflow:hidden;background:var(--paper);">
        <svg viewBox="200 60 220 220" width="220px" height="220px" style="margin:-35px 0 0 -35px;">
          <rect x="40" y="40" width="820" height="560" fill="none" stroke="#1f2734" stroke-width="7"/>
          <line x1="180" y1="40" x2="180" y2="260" stroke="#1f2734" stroke-width="5"/>
          <line x1="320" y1="40" x2="320" y2="260" stroke="#1f2734" stroke-width="5"/>
          <line x1="10" y1="150" x2="410" y2="150" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
          <line x1="230" y1="0" x2="230" y2="400" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
          <circle cx="230" cy="150" r="6" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
        </svg>
      </div>
      <!-- connecting stem -->
      <div style="position:absolute;left:0;top:-30px;width:2px;height:30px;transform:translateX(-50%);
          background:rgba(31,39,52,.25);"></div>
      <!-- finger contact ellipse -->
      <div style="position:absolute;left:0;top:0;width:52px;height:44px;transform:translate(-50%,-50%);
          border-radius:50%;background:rgba(31,39,52,.18);border:1.5px solid rgba(31,39,52,.3);"></div>
    </div>

    <div style="position:absolute;left:50%;top:36px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
        height:44px;padding:0 18px;background:var(--surface);color:var(--text);border:1px solid var(--border);
        border-radius:22px;box-shadow:var(--shadow-float);font-size:13.5px;font-weight:600;white-space:nowrap;">
      롱프레스 → 손끝 위 돋보기 · 드래그로 미세조정 → 손을 떼면 확정
    </div>

    <div style="position:absolute;left:16px;top:24px;background:var(--surface);border-radius:var(--radius-lg);
        box-shadow:var(--shadow-float);padding:8px;display:flex;flex-direction:column;gap:4px;">
      <div class="tool-btn active" title="점"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>
      <div class="tool-btn" title="방향"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg></div>
      <div class="tool-btn" title="영역"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></div>
    </div>

  </div>

  <!-- rationale strip -->
  <div style="position:absolute;left:96px;right:96px;bottom:26px;background:rgba(31,39,52,.9);color:#fff;
      border-radius:var(--radius-lg);padding:12px 18px;font-size:12.5px;line-height:1.6;">
    미채택 사유 — 롱프레스가 컨텍스트 메뉴(우클릭 메뉴)와 같은 제스처를 두고 경쟁하고, 돋보기가
    화면만 확대할 뿐 손가락의 실제 이동 해상도는 그대로라 확대율이 높을수록 미세조정이 더 떨린다.
  </div>

</div>
</x-dc>
</body>
</html>
