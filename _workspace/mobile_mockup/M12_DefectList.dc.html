<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#ffffff; --bg:#eceff5; --surface:#ffffff; --surface-2:#f5f7fa;
      --text:#1f2734; --text-muted:#666b73; --text-dim:#9aa4b0; --border:#d9dee8; --border-2:#eef1f6;
      --accent:#2d6cdf; --accent-weak:#e8f0fd;
      --cur:#e5342a; --prev:#7c4dff; --warn:#e3a535; --warn-weak:#fdf2df;
      --radius:3px; --radius-lg:6px; --shadow-float:0 6px 24px rgba(31,39,52,.16);
      --font-ui:'Noto Sans KR',Pretendard,-apple-system,"Segoe UI",sans-serif;
      --font-num:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font-ui);color:var(--text);}
    a{color:var(--accent);} a:hover{color:var(--accent-ink);}
    .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
    .row{display:flex;align-items:center;gap:12px;padding:10px 20px;height:48px;border-bottom:1px solid var(--border-2);}
    .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
    .sec{font-size:11.5px;font-weight:700;color:var(--text-dim);padding:14px 20px 6px;background:var(--surface-2);}
  </style>
</helmet>

<div style="width:1180px;height:820px;background:var(--bg);position:relative;overflow:hidden;">

  <!-- dimmed canvas behind -->
  <div style="position:absolute;inset:0;padding:24px 24px 24px 420px;opacity:.4;">
    <div style="width:100%;height:100%;background:var(--paper);border-radius:var(--radius-lg);"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(31,39,52,.12);"></div>

  <!-- top bar -->
  <div style="position:absolute;left:0;right:0;top:0;height:52px;background:var(--surface);
      border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;">
    <span style="font-size:15px;font-weight:700;">○○아파트 3차</span>
    <span style="font-size:14px;color:var(--text-dim);margin-left:8px;">· 지상2층</span>
  </div>

  <!-- slide-in list sheet -->
  <div style="position:absolute;left:0;top:52px;bottom:0;width:400px;background:var(--surface);
      box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden;">

    <div style="flex:0 0 auto;padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;
        border-bottom:1px solid var(--border-2);">
      <span style="font-size:17px;font-weight:700;">조사항목</span>
      <div style="width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;
          justify-content:center;color:var(--text-dim);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>

    <div style="flex:0 0 auto;display:flex;gap:8px;padding:12px 20px;">
      <span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
          background:var(--warn-weak);color:#8a5a10;font-size:12.5px;font-weight:700;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8a5a10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        미완성 <span class="num">3</span>건
      </span>
      <span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
          background:var(--surface-2);color:var(--text-muted);font-size:12.5px;font-weight:700;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><line x1="4" y1="4" x2="20" y2="20"/></svg>
        위치 미지정 <span class="num">2</span>건
      </span>
    </div>

    <div style="flex:1 1 auto;overflow:auto;">

      <div class="sec">현회차 · <span class="num">14</span>건</div>

      <div class="row">
        <span class="dot" style="background:var(--cur);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            <span class="num">#14</span> 벽(비구조체) · 경사균열
          </div>
        </div>
        <span class="num" style="font-size:12px;color:var(--text-dim);">0.3×1500</span>
      </div>

      <div class="row">
        <span class="dot" style="background:var(--cur);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;">
            <span class="num">#13</span> 상부슬래브 · 누수흔적
          </div>
        </div>
        <span class="num" style="font-size:12px;color:var(--text-dim);">0.5㎡</span>
      </div>

      <div class="row" style="background:var(--warn-weak);">
        <span class="dot" style="background:var(--warn);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;color:#8a5a10;">
            <span class="num">#12</span> 정보 없음
          </div>
        </div>
        <span style="font-size:11.5px;font-weight:700;color:#8a5a10;">미완성</span>
      </div>

      <div class="row">
        <span class="dot" style="background:var(--cur);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;">
            <span class="num">#11</span> 기둥 · 박리
          </div>
        </div>
        <span class="num" style="font-size:12px;color:var(--text-dim);">1ea</span>
      </div>

      <div class="row" style="background:var(--surface-2);">
        <span style="width:9px;height:9px;flex:0 0 auto;border-radius:50%;border:1.5px dashed var(--text-dim);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;color:var(--text-muted);">
            <span class="num">#10</span> 계단난간 · 파손
          </div>
        </div>
        <span style="font-size:11.5px;font-weight:700;color:var(--text-dim);">위치 미지정</span>
      </div>

      <div class="sec">전회차 · <span class="num">7</span>건</div>

      <div class="row">
        <span class="dot" style="background:var(--prev);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;color:var(--text-muted);">
            <span class="num">#8</span> 벽(구조체) · 수직균열
          </div>
        </div>
        <span style="font-size:11.5px;color:var(--prev);font-weight:700;">전회차</span>
      </div>

      <div class="row">
        <span class="dot" style="background:var(--prev);"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;color:var(--text-muted);">
            <span class="num">#7</span> 보 · 철근노출
          </div>
        </div>
        <span style="font-size:11.5px;color:var(--prev);font-weight:700;">전회차</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
