<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 는 넣지 않는다 — styles.css 에 `env(safe-area-inset-*)` 처리가
      아직 한 곳도 없어서, 지금 켜면 노치 기기에서 UI 가 노치 아래로 들어간다.
      태블릿 셸(T2-1) 에서 안전영역 CSS 와 함께 켠다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnSpect — 도면 캔버스</title>

    <!--
      PC/태블릿 강제 전환 (2026-09-02, UI 정리 4건 U-4) — 실기기 없이도 두 UI를 구분해 테스트하려고 둔
      오버라이드다. 실제 판정(터치 전용 기기 = hover:none and pointer:coarse, styles.css 참고)은
      그대로 정본이다 — 이 스크립트는 그 결과를 URL/localStorage로 "덮어쓸" 뿐 대체하지 않는다.
      /tablet · /pc 경로(vercel.json rewrite)나 ?ui=tablet|pc 쿼리로 들어오면 그 값을 저장하고,
      없으면 저장된 값을, 그마저 없으면 실제 기기 판정을 쓴다. body 렌더 전에 끝나야 깜빡임이 없다.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var fromQuery = params.get('ui');
          var fromPath =
            location.pathname === '/tablet' ? 'tablet' : location.pathname === '/pc' ? 'pc' : null;
          var forced = fromQuery === 'tablet' || fromQuery === 'pc' ? fromQuery : fromPath;
          if (forced) localStorage.setItem('onspect:uiModeOverride', forced);
          var stored = localStorage.getItem('onspect:uiModeOverride');
          var mode =
            stored === 'tablet' || stored === 'pc'
              ? stored
              : window.matchMedia('(hover: none) and (pointer: coarse)').matches
                ? 'tablet'
                : 'pc';
          document.documentElement.dataset.uiMode = mode;
        } catch (e) {
          /* localStorage 접근 불가(사생활 모드 등) — 조용히 실기기 판정으로만 동작 */
        }
      })();
    </script>

    <!--
      밝은/어두운 테마 (2026-09-03 사용자 요청, 태블릿 전용) — 위 U-4 와 같은 이유로 body 렌더 전에
      찍는다. 시스템 설정을 따라가지 않는다 — 사용자가 직접 고른 값만 쓴다(안 골랐으면 밝은 테마).
      토글은 `useTheme.ts` + `App.tsx`(태블릿에서만 노출).
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('onspect:theme');
          document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {
          /* localStorage 접근 불가 — 밝은 테마로 렌더된다(styles.css 기본값) */
        }
      })();
    </script>

    <!-- PWA (P1) — display:standalone · orientation:any (D10 이 가로·세로를 둘 다 정의했다) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b4ba8" />
    <!--
      iOS/iPadOS 는 매니페스트의 icons 를 홈 화면 아이콘으로 쓰지 않는다.
      `apple-touch-icon` 이 없으면 화면 스크린샷이 아이콘이 된다 — 반드시 남긴다.
    -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OnSpect" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
